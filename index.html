<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="配送検品">
<meta name="theme-color" content="#1f5fbf">
<title>ルート配送 検品</title>
<script>
  /* ▼▼▼ GAS をデプロイしたときの「ウェブアプリ URL」（…/exec）を貼り付けてください ▼▼▼ */
  const API_URL = 'https://script.google.com/macros/s/AKfycbySm69h-x-a0MzUqs79vxoNnKtGerC_8BY4qMKzatcevbP65dI-058Ioe-aQK06jQYABA/exec';
</script>
<style>
  :root {
    --bg: #f3f5f8; --card: #fff; --ink: #1d2433; --sub: #6b7385; --line: #dfe3ea;
    --pri: #1f5fbf; --ok: #14894a; --okbg: #e3f5ea; --part: #b26a00; --partbg: #fff2d9;
    --ng: #c62828; --ngbg: #fde4e4; --warn: #6b5d00; --warnbg: #fff8c5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; font-size: 16px; }
  button, input, select { font: inherit; }
  header { position: sticky; top: 0; z-index: 10; background: var(--pri); color: #fff;
    display: flex; align-items: center; gap: 8px; padding: 10px 12px; min-height: 52px; }
  header .ttl { font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header button { background: rgba(255,255,255,.18); color: #fff; border: 0; border-radius: 8px; padding: 7px 10px; }
  header .who { font-size: 13px; opacity: .9; }
  .badge { background: #ffb300; color: #000; border-radius: 10px; padding: 1px 8px; font-size: 12px; font-weight: 700; }
  main { padding: 12px; max-width: 720px; margin: 0 auto; }
  .view { display: none; } .view.on { display: block; }
  .box { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  label.f { display: block; font-size: 13px; color: var(--sub); margin: 10px 0 4px; }
  input[type=text], input[type=password], input[type=number], select {
    width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 10px;
    padding: 12px 16px; background: var(--pri); color: #fff; font-weight: 700; cursor: pointer; }
  .btn.sub { background: #e7ecf4; color: var(--ink); }
  .btn.red { background: var(--ng); }
  .btn.full { width: 100%; }
  .btn:disabled { opacity: .5; }
  .row { display: flex; gap: 8px; align-items: center; } .row > * { flex: 1; }
  .chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 20px; padding: 6px 14px; font-size: 14px; }
  .chip.on { background: var(--pri); border-color: var(--pri); color: #fff; }
  .prog { height: 10px; background: #e7ecf4; border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .prog > div { height: 100%; background: var(--ok); width: 0; transition: width .3s; }
  .sum { display: flex; justify-content: space-between; font-size: 14px; color: var(--sub); margin-top: 6px; }
  .card { background: var(--card); border: 1px solid var(--line); border-left: 6px solid #b9c1cf; border-radius: 10px;
    padding: 12px; margin-bottom: 8px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
  .card .nm { font-weight: 700; } .card .ad { font-size: 13px; color: var(--sub); margin-top: 2px; }
  .card .cnt { font-size: 20px; font-weight: 800; min-width: 64px; text-align: right; white-space: nowrap; }
  .card.st-途中 { border-left-color: var(--part); } .card.st-途中 .cnt { color: var(--part); }
  .card.st-完了 { border-left-color: var(--ok); background: #f6fbf8; } .card.st-完了 .cnt { color: var(--ok); }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 6px; background: #eef2f7; color: var(--sub); margin-right: 4px; }
  .tag.warn { background: var(--partbg); color: var(--part); }
  .muted { color: var(--sub); font-size: 13px; }
  .center { text-align: center; }
  .shead .nm { font-size: 20px; font-weight: 800; }
  .shead a { color: var(--pri); }
  .big { font-size: 44px; font-weight: 900; text-align: center; line-height: 1.1; }
  .big small { font-size: 18px; font-weight: 700; color: var(--sub); }
  .banner { border-radius: 12px; padding: 16px; text-align: center; margin: 10px 0; background: #eef2f7; }
  .banner .t { font-size: 28px; font-weight: 900; } .banner .s { margin-top: 4px; font-size: 15px; }
  .banner.ok { background: var(--partbg); color: var(--part); }
  .banner.done { background: var(--okbg); color: var(--ok); }
  .banner.ng { background: var(--ngbg); color: var(--ng); animation: shake .4s; }
  .banner.warn { background: var(--warnbg); color: var(--warn); }
  @keyframes shake { 0%,100%{transform:none} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  #reader { position: relative; width: 100%; height: 240px; border-radius: 12px; overflow: hidden; background: #000; }
  #reader video { width: 100%; height: 100%; object-fit: cover; display: block; }
  #reader .guide { position: absolute; left: 5%; right: 5%; top: 30%; bottom: 30%; border: 3px solid rgba(255,255,255,.85);
    border-radius: 10px; box-shadow: 0 0 0 999px rgba(0,0,0,.35); pointer-events: none; }
  #reader .guide::after { content: ''; position: absolute; left: 4%; right: 4%; top: 50%; height: 2px; background: #ff3b30; }
  #reader .torch { position: absolute; right: 8px; top: 8px; background: rgba(0,0,0,.5); color: #fff; border: 0;
    border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  #reader.off { height: 0; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #222; color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 90%; display: none; z-index: 99; }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; }
  .tabs button { flex: 1; border: 0; background: #e7ecf4; padding: 10px; border-radius: 10px; font-weight: 700; white-space: nowrap; }
  .tabs button.on { background: var(--pri); color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { border-bottom: 1px solid var(--line); padding: 8px 6px; text-align: left; vertical-align: top; }
  th { color: var(--sub); font-weight: 600; font-size: 12px; }
  td.num { text-align: right; white-space: nowrap; }
  .tbl { overflow-x: auto; }
  .link { color: var(--pri); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  .ck { display: flex; align-items: center; gap: 8px; margin-top: 10px; } .ck input { width: 22px; height: 22px; }
  .err { color: var(--ng); font-size: 14px; margin-top: 8px; min-height: 1em; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <button id="h-back" class="hidden">◀</button>
  <div class="ttl" id="h-title">ルート配送 検品</div>
  <span id="h-pend" class="badge hidden"></span>
  <button id="h-reload" class="hidden" title="更新">⟳</button>
  <button id="h-admin" class="hidden">管理</button>
</header>

<main>
  <!-- ログイン -->
  <section id="v-login" class="view">
    <div class="box">
      <h2 style="margin:0 0 6px">ログイン</h2>
      <div class="muted">一度ログインすると、この端末ではログアウトするまでログイン状態が続きます。</div>
      <label class="f">社員ID</label>
      <input id="l-id" type="text" inputmode="numeric" autocomplete="username">
      <label class="f">PIN（設定されている場合のみ）</label>
      <input id="l-pin" type="password" inputmode="numeric" autocomplete="current-password">
      <div class="err" id="l-err"></div>
      <button class="btn full" id="l-go" style="margin-top:8px">ログイン</button>
    </div>
  </section>

  <!-- コース・店舗一覧 -->
  <section id="v-home" class="view">
    <div class="box">
      <div class="row">
        <div><label class="f" style="margin-top:0">納品日</label><select id="h-date"></select></div>
      </div>
      <label class="f">コース（便名）</label>
      <select id="h-course"></select>
      <div class="chips" id="h-ampm"></div>
      <div class="chips"><button class="chip" id="h-hide">完了を隠す</button></div>
      <div class="prog"><div id="h-bar"></div></div>
      <div class="sum"><span id="h-sum1"></span><span id="h-sum2"></span></div>
    </div>
    <div id="h-list"></div>
    <div class="center muted" style="margin:24px 0">
      <span id="h-user"></span><br>
      <button class="link" id="h-logout">この端末からログアウト</button>
    </div>
  </section>

  <!-- 店舗（検品） -->
  <section id="v-store" class="view">
    <div class="box shead">
      <div class="nm" id="s-name"></div>
      <div class="muted" id="s-meta"></div>
      <div style="margin-top:6px;font-size:14px" id="s-addr"></div>
    </div>
    <div class="big"><span id="s-done">0</span><small> / <span id="s-need">1</span> 口</small></div>
    <div class="banner" id="s-banner"><div class="t">読取待ち</div><div class="s">店舗ラベルのバーコードにカメラをかざしてください</div></div>
    <div id="reader" class="off">
      <video id="video" playsinline muted autoplay></video>
      <div class="guide"></div>
      <button class="torch hidden" id="s-torch">💡 ライト</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn" id="s-cam">カメラ開始</button>
      <label class="btn sub">写真で読取<input type="file" id="s-photo" accept="image/*" capture="environment" hidden></label>
    </div>
    <div class="row" style="margin-top:8px">
      <input type="text" id="s-manual" inputmode="numeric" placeholder="手入力 / 外付けスキャナ">
      <button class="btn sub" id="s-manual-go" style="flex:0 0 auto">確認</button>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn sub" id="s-undo">取消（−1）</button>
      <button class="btn" id="s-next">次の店舗 ▶</button>
    </div>
    <label class="ck muted"><input type="checkbox" id="s-autocam"> 店舗を開いたら自動でカメラを起動</label>
  </section>

  <!-- 管理 -->
  <section id="v-admin" class="view">
    <div class="tabs">
      <button data-t="imp" class="on">取込</button>
      <button data-t="prog">進捗</button>
      <button data-t="emp">社員</button>
      <button data-t="set">設定</button>
    </div>

    <div id="t-imp" class="tab">
      <div class="box">
        <b>配送データの取込</b>
        <div class="muted" style="margin:4px 0 10px">「ルート配送シングル○○納品.xls」を選択してください（複数可・xlsx/csvも可）。同じ納品日を取り込み直すと、読取済みの進捗は引き継がれます。</div>
        <input type="file" id="i-file" multiple accept=".xls,.xlsx,.csv">
        <div id="i-preview" style="margin-top:10px"></div>
        <button class="btn full" id="i-run" disabled style="margin-top:10px">取込実行</button>
        <div id="i-result" style="margin-top:10px"></div>
      </div>
    </div>

    <div id="t-prog" class="tab hidden">
      <div class="box">
        <div class="row"><select id="p-date"></select><button class="btn sub" id="p-load" style="flex:0 0 auto">表示</button></div>
        <div class="tbl" style="margin-top:10px"><table id="p-sum"></table></div>
      </div>
      <div class="box hidden" id="p-detail-box">
        <b id="p-detail-title"></b>
        <div class="tbl" style="margin-top:8px"><table id="p-detail"></table></div>
      </div>
    </div>

    <div id="t-emp" class="tab hidden">
      <div class="box">
        <b id="e-title">社員の追加</b>
        <label class="f">会社名</label><input type="text" id="e-company" list="e-companies">
        <datalist id="e-companies"></datalist>
        <label class="f">社員ID（ログインに使用・全社で重複不可）</label><input type="text" id="e-id">
        <label class="f">名前</label><input type="text" id="e-name">
        <label class="f">PIN（任意・空欄ならIDだけでログイン）</label><input type="text" id="e-pin" inputmode="numeric">
        <label class="ck"><input type="checkbox" id="e-admin"> 管理権限（取込・社員管理ができる）</label>
        <label class="ck"><input type="checkbox" id="e-active" checked> 有効</label>
        <div class="err" id="e-err"></div>
        <div class="row" style="margin-top:8px">
          <button class="btn sub" id="e-cancel">クリア</button>
          <button class="btn" id="e-save">保存</button>
        </div>
      </div>
      <div class="box tbl"><table id="e-list"></table></div>
    </div>

    <div id="t-set" class="tab hidden">
      <div class="box">
        <b>読取設定</b>
        <label class="f">JANプレフィックス（店舗コードの前に付く固定の数字。空欄 = 自動判定）</label>
        <input type="text" id="c-prefix" inputmode="numeric">
        <label class="f">同じバーコードの再読取間隔（秒）</label>
        <input type="number" id="c-gap" step="0.5" min="0">
        <label class="f">配送データの保持日数（0 = 削除しない）</label>
        <input type="number" id="c-ret" min="0">
        <button class="btn full" id="c-save" style="margin-top:12px">保存</button>
      </div>
      <div class="box">
        <b>バーコード判定テスト</b>
        <div class="muted" style="margin:4px 0 8px">ラベルのバーコードの数字を入力すると、どの店舗コードとして判定されるか確認できます（現在表示中の納品日のデータで判定）。</div>
        <div class="row"><input type="text" id="c-test" inputmode="numeric"><button class="btn sub" id="c-test-go" style="flex:0 0 auto">判定</button></div>
        <div id="c-test-out" style="margin-top:8px"></div>
      </div>
    </div>
  </section>
</main>
<div id="toast"></div>

<script>
/* ======================= 共通 ======================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const errMsg = e => String((e && e.message) || e || '').replace(/^Error:\s*/, '');

async function api(fn, ...args) {
  let r;
  try {
    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn, args }), redirect: 'follow' });
    r = await res.json();
  } catch (e) {
    throw new Error('通信できません（電波を確認してください）');
  }
  if (!r.ok) {
    if (r.error === 'AUTH') forceLogout();
    throw new Error(r.error);
  }
  return r.data;
}

let toastTimer = null;
function toast(m, ms) {
  const t = $('#toast'); t.textContent = m; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = 'none'; }, ms || 3000);
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const fmtDate = d => d ? `${d.slice(0, 4)}/${d.slice(4, 6)}/${d.slice(6, 8)}（${'日月火水木金土'[new Date(+d.slice(0, 4), +d.slice(4, 6) - 1, +d.slice(6, 8)).getDay()]}）` : '';

/* ======================= 状態 ======================= */
const S = {
  token: LS.get('token', ''),
  user: null, dates: [], date: '', rows: [],
  course: LS.get('course', ''), ampm: LS.get('ampm', ''), hideDone: LS.get('hideDone', '0') === '1',
  cur: null, settings: { prefix: '', gap: 1.5 },
  pending: JSON.parse(LS.get('pending', '[]') || '[]'),
  view: '',
};
const savePending = () => { LS.set('pending', JSON.stringify(S.pending)); updBadge(); };

/* ======================= 店舗コード判定（サーバーと同じ処理） ======================= */
const z = v => { const s = String(v == null ? '' : v).normalize('NFKC').replace(/\s/g, ''); if (!s) return ''; const t = s.replace(/^0+/, ''); return t === '' ? '0' : t; };
function gtinOk(d) { let sum = 0; for (let i = d.length - 2, w = 3; i >= 0; i--, w = 4 - w) sum += +d[i] * w; return (10 - sum % 10) % 10 === +d[d.length - 1]; }
function cands(raw) {
  const d = String(raw == null ? '' : raw).normalize('NFKC').replace(/\D/g, '');
  const out = []; const add = x => { const v = z(x); if (v && !out.includes(v)) out.push(v); };
  if (!d) return out;
  add(d);
  const isGtin = [8, 12, 13, 14].includes(d.length) && gtinOk(d);
  const body = isGtin ? d.slice(0, -1) : d;
  const prefix = String(S.settings.prefix || '').replace(/\D/g, '');
  if (prefix) { if (body.startsWith(prefix)) add(body.slice(prefix.length)); return out; }
  add(body);
  if (body.length >= 7 && /^[02]/.test(body)) { add(body.slice(1)); add(body.slice(2)); }
  return out;
}
function findOwner(c, bin) {
  let hit = null;
  for (const r of S.rows) { if (c.includes(r.cd)) { if (r.bin === bin) return r; hit = hit || r; } }
  return hit;
}

/* ======================= 画面切替 ======================= */
function show(v) {
  S.view = v;
  $$('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + v));
  $('#h-back').classList.toggle('hidden', v === 'home' || v === 'login');
  $('#h-reload').classList.toggle('hidden', v !== 'home');
  $('#h-admin').classList.toggle('hidden', !(S.user && S.user.admin) || v !== 'home');
  $('#h-title').textContent = v === 'admin' ? '管理' : v === 'store' ? (S.cur ? S.cur.bin : '') : 'ルート配送 検品';
  if (v !== 'store') stopCam();
  window.scrollTo(0, 0);
}
$('#h-back').onclick = () => { show('home'); renderHome(); };
$('#h-reload').onclick = () => { flush(); loadDay(); };
$('#h-admin').onclick = () => openAdmin();

/* ======================= ログイン ======================= */
function showLogin() {
  show('login');
  $('#l-id').focus();
}
$('#l-pin').onkeydown = $('#l-id').onkeydown = e => { if (e.key === 'Enter') $('#l-go').click(); };
$('#l-go').onclick = async () => {
  const id = $('#l-id').value.trim(), pin = $('#l-pin').value.trim();
  if (!id) { $('#l-err').textContent = '社員IDを入力してください'; return; }
  $('#l-go').disabled = true; $('#l-err').textContent = '';
  try {
    const r = await api('login', id, pin, navigator.userAgent);
    S.token = r.token; LS.set('token', r.token);
    await boot();
  } catch (e) { $('#l-err').textContent = errMsg(e); }
  finally { $('#l-go').disabled = false; }
};
function forceLogout() {
  S.token = ''; LS.del('token'); S.user = null;
  toast('ログインが無効になりました。再度ログインしてください', 5000);
  showLogin();
}
$('#h-logout').onclick = async () => {
  if (S.pending.length && !confirm('未送信の読取データが ' + S.pending.length + ' 件あります。ログアウトすると送信されません。続けますか？')) return;
  if (!confirm('この端末からログアウトしますか？')) return;
  try { await api('logout', S.token); } catch (e) {}
  S.token = ''; LS.del('token'); S.user = null; showLogin();
};

/* ======================= 起動 ======================= */
async function boot() {
  if (!S.token) return showLogin();
  try {
    const b = await api('bootstrap', S.token);
    S.user = b.user; S.dates = b.dates; S.settings = b.settings;
    LS.set('boot', JSON.stringify({ user: b.user, dates: b.dates, settings: b.settings }));
    pickDate(b.today);
  } catch (e) {
    if (!S.token) return;
    // 電波が無い場合は前回のデータで動かす
    const c = JSON.parse(LS.get('boot', 'null') || 'null');
    if (!c) { toast('通信できません: ' + errMsg(e), 5000); return; }
    Object.assign(S, { user: c.user, dates: c.dates, settings: c.settings });
    const day = JSON.parse(LS.get('day', 'null') || 'null');
    if (day) { S.date = day.date; S.rows = day.rows; }
    toast('オフラインで表示しています', 4000);
  }
  $('#h-user').textContent = `${S.user.company}　${S.user.name}（${S.user.id}）`;
  renderDates();
  show('home');
  if (S.date && !S.rows.length) await loadDay(); else renderHome();
  flush();
}
function pickDate(today) {
  const d = S.dates;
  S.date = d.includes(today) ? today : (d.find(x => x >= today) || d[d.length - 1] || '');
}
function renderDates() {
  $('#h-date').innerHTML = S.dates.length
    ? S.dates.slice().reverse().map(d => `<option value="${d}">${fmtDate(d)}</option>`).join('')
    : '<option value="">データがありません</option>';
  $('#h-date').value = S.date;
}
$('#h-date').onchange = () => { S.date = $('#h-date').value; S.rows = []; loadDay(); };

async function loadDay() {
  if (!S.date) { S.rows = []; renderHome(); return; }
  $('#h-list').innerHTML = '<div class="center muted" style="padding:20px">読み込み中…</div>';
  try {
    const r = await api('getDay', S.token, S.date);
    S.rows = r.rows;
    S.rows.forEach(row => { row.done += pendingInc(row); fixState(row); });
    LS.set('day', JSON.stringify({ date: S.date, rows: S.rows }));
  } catch (e) { toast('読み込めませんでした: ' + errMsg(e), 4000); }
  renderHome();
}
const pendingInc = row => S.pending.filter(p => p.inc && p.date === S.date && p.bin === row.bin && p.targetCd === row.cd).length;
const fixState = r => { r.state = r.done <= 0 ? '未' : r.done >= r.need ? '完了' : '途中'; };

/* ======================= コース・店舗一覧 ======================= */
function renderHome() {
  const bins = [];
  S.rows.forEach(r => { if (!bins.includes(r.bin)) bins.push(r.bin); });
  const binStat = b => { const rs = S.rows.filter(r => r.bin === b); return `${rs.filter(r => r.state === '完了').length}/${rs.length}`; };
  $('#h-course').innerHTML = '<option value="">コースを選択してください</option>' +
    bins.map(b => `<option value="${esc(b)}">${esc(b)}（${binStat(b)}）</option>`).join('');
  if (S.course && bins.includes(S.course)) $('#h-course').value = S.course;

  const ap = [''].concat([...new Set(S.rows.filter(r => r.bin === S.course).map(r => r.ampm).filter(Boolean))]);
  $('#h-ampm').innerHTML = ap.length > 2 ? ap.map(a => `<button class="chip ${S.ampm === a ? 'on' : ''}" data-a="${esc(a)}">${a || 'すべて'}</button>`).join('') : '';
  $$('#h-ampm .chip').forEach(b => b.onclick = () => { S.ampm = b.dataset.a; LS.set('ampm', S.ampm); renderHome(); });
  $('#h-hide').classList.toggle('on', S.hideDone);

  const list = courseRows();
  const total = list.length, done = list.filter(r => r.state === '完了').length;
  const pk = list.reduce((a, r) => a + r.need, 0), pd = list.reduce((a, r) => a + Math.min(r.done, r.need), 0);
  $('#h-bar').style.width = (total ? done / total * 100 : 0) + '%';
  $('#h-sum1').textContent = S.course ? `店舗 ${done} / ${total} 完了` : '';
  $('#h-sum2').textContent = S.course ? `荷物 ${pd} / ${pk} 口` : '';

  if (!S.date) { $('#h-list').innerHTML = '<div class="box center muted">配送データがまだ取り込まれていません</div>'; return; }
  if (!S.course || !bins.includes(S.course)) { $('#h-list').innerHTML = '<div class="box center muted">コースを選択してください</div>'; return; }
  const shown = list.filter(r => !(S.hideDone && r.state === '完了'));
  $('#h-list').innerHTML = shown.length ? shown.map(r => `
    <div class="card st-${r.state}" data-cd="${esc(r.cd)}">
      <div style="flex:1;min-width:0">
        <div class="nm">${esc(r.name)}</div>
        <div class="ad">${r.ampm ? `<span class="tag">${esc(r.ampm)}</span>` : ''}<span class="tag">${esc(r.cd)}</span>${r.need > 1 ? `<span class="tag warn">${r.need}口</span>` : ''}${r.kan && r.kan !== '通常梱包' ? `<span class="tag warn">${esc(r.kan)}</span>` : ''}${esc(r.addr)}</div>
      </div>
      <div class="cnt">${r.state === '完了' ? '✓ ' : ''}${r.done}/${r.need}</div>
    </div>`).join('') : '<div class="box center muted">すべて完了しました 🎉</div>';
  $$('#h-list .card').forEach(c => c.onclick = () => openStore(S.course, c.dataset.cd));
}

function onScan(raw) {
  const row = curRow(); if (!row || !raw) return;
  const c = cands(raw);
  const item = { scanId: uid(), date: S.date, bin: row.bin, targetCd: row.cd, raw: String(raw), inc: false };
  if (c.includes(row.cd)) {
    if (row.done >= row.need) {
      banner('warn', '読取済み', `この店舗は ${row.need} 口すべて読取済みです`); sound('warn');
    } else {
      row.done++; item.inc = true; fixState(row);
      if (row.state === '完了') { banner('done', '完了', `${row.done} / ${row.need} 口　すべて揃いました`); sound('done'); }
      else { banner('ok', '一致', `${row.done} / ${row.need} 口　残り ${row.need - row.done} 口`); sound('ok'); }
    }
  } else {
    const o = findOwner(c, row.bin);
    banner('ng', '不一致', o ? `この荷物は「${o.name}」${o.bin !== row.bin ? '（' + o.bin + '）' : ''}宛です` : `読取値 ${raw} は該当する店舗がありません`);
    sound('ng');
  }
  S.pending.push(item); savePending();
  renderStore();
  flush();
}
$('#s-manual-go').onclick = () => { const v = $('#s-manual').value.trim(); if (v) { onScan(v); $('#s-manual').value = ''; } };

$('#s-undo').onclick = async () => {
  const r = curRow(); if (!r || r.done <= 0) return;

  await flush();

/* ======================= 送信キュー（電波が悪くても読取を失わない） ======================= */
let flushing = null, retryTimer = null;
function flush() {
  if (flushing) return flushing;
  flushing = (async () => {
    while (S.pending.length && S.token) {
      const it = S.pending[0];
      try {
        const res = await api('scan', S.token, it);
        S.pending.shift(); savePending();
        if (res && res.row && it.date === S.date) applyServerRow(res.row);
      } catch (e) {
        const m = errMsg(e);
        if (m === 'AUTH') break;
        if (/見つかりません|データがありません/.test(m)) { S.pending.shift(); savePending(); toast('送信できない読取を破棄しました: ' + m, 5000); continue; }
        clearTimeout(retryTimer); retryTimer = setTimeout(flush, 5000);
        break;
      }
    }
  })().finally(() => { flushing = null; updBadge(); });
  updBadge();
  return flushing;
}
function applyServerRow(sr) {
  const r = S.rows.find(x => x.bin === sr.bin && x.cd === sr.cd);
  if (!r) return;
  Object.assign(r, sr); r.done = sr.done + pendingInc(r); fixState(r);
  LS.set('day', JSON.stringify({ date: S.date, rows: S.rows }));
  if (S.view === 'store') renderStore();
}
function updBadge() {
  const n = S.pending.length, b = $('#h-pend');
  b.textContent = '未送信 ' + n; b.classList.toggle('hidden', n === 0);
}
window.addEventListener('online', () => flush());
document.addEventListener('visibilitychange', () => { if (!document.hidden) flush(); });

/* ======================= カメラ ======================= */
/*
 * Android(Chrome) は端末内蔵の BarcodeDetector（高速）を使用。
 * iPhone など未対応の端末は ZXing C++(WebAssembly) 版の互換実装を読み込んで使用。
 */
const FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf', 'codabar'];
const PONYFILL = 'https://fastly.jsdelivr.net/npm/barcode-detector@3/dist/es/ponyfill.min.js';
let detectorP = null;
function getDetector() {
  if (!detectorP) detectorP = (async () => {
    if ('BarcodeDetector' in window) {
      try {
        const sup = await window.BarcodeDetector.getSupportedFormats();
        if (sup.includes('ean_13')) return new window.BarcodeDetector({ formats: FORMATS.filter(f => sup.includes(f)) });
      } catch (e) {}
    }
    const m = await import(PONYFILL);
    return new m.BarcodeDetector({ formats: FORMATS });
  })().catch(e => { detectorP = null; throw e; });
  return detectorP;
}

let camOn = false, stream = null, torchOn = false, last = { text: '', seen: 0 };
const video = $('#video');
const cvs = document.createElement('canvas');
const ctx = cvs.getContext('2d', { willReadFrequently: true });

async function startCam() {
  if (camOn) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast('この画面ではカメラが使えません。Safari / Chrome で直接開いてください', 6000); return;
  }
  $('#s-cam').disabled = true;
  try {
    const det = getDetector(); // カメラ起動と並行して読込
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
    });
    video.srcObject = stream;
    await video.play();
    $('#reader').classList.remove('off');
    const track = stream.getVideoTracks()[0];
    const cap = track.getCapabilities ? track.getCapabilities() : {};
    if (cap.focusMode && cap.focusMode.includes('continuous')) {
      try { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
    }
    $('#s-torch').classList.toggle('hidden', !cap.torch);
    camOn = true; $('#s-cam').textContent = 'カメラ停止';
    await det;
    scanLoop();
  } catch (e) {
    stopCam();
    const m = errMsg(e);
    toast(/NotAllowed|Permission/i.test(m)
      ? 'カメラの使用が許可されていません。ブラウザの設定でカメラを「許可」にしてください'
      : 'カメラを起動できません: ' + m, 7000);
  } finally { $('#s-cam').disabled = false; }
}

async function scanLoop() {
  if (!camOn) return;
  try {
    const vw = video.videoWidth, vh = video.videoHeight;
    if (vw && vh) {
      // 画面のガイド枠付近（上下に少し余裕を持たせる）だけを切り出して解析 → 速く・細いバーも読める
      const W = video.clientWidth, H = video.clientHeight;
      const sc = Math.max(W / vw, H / vh), ox = (vw * sc - W) / 2, oy = (vh * sc - H) / 2;
      const sx = (0.02 * W + ox) / sc, sw = (0.96 * W) / sc;
      const sy = (0.18 * H + oy) / sc, sh = (0.64 * H) / sc;
      const k = Math.min(1, 1280 / sw);
      cvs.width = Math.round(sw * k); cvs.height = Math.round(sh * k);
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, cvs.width, cvs.height);
      const res = await (await getDetector()).detect(cvs);
      if (res.length) onCamCode(res[0].rawValue);
    }
  } catch (e) { /* 1フレームの失敗は無視 */ }
  if (camOn) setTimeout(scanLoop, 40);
}

function onCamCode(text) {
  // 同じラベルを映し続けている間は数えない。一度カメラから外せば次の荷物として数える
  const now = Date.now(), gap = (Number(S.settings.gap) || 0) * 1000;
  if (text === last.text && now - last.seen < gap) { last.seen = now; return; }
  last = { text, seen: now };
  onScan(text);
}

async function stopCam() {
  camOn = false;
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null; torchOn = false;
  $('#reader').classList.add('off');
  $('#s-cam').textContent = 'カメラ開始';
}

$('#s-torch').onclick = async () => {
  if (!stream) return;
  torchOn = !torchOn;
  try { await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ torch: torchOn }] }); } catch (e) {}
};

async function scanPhoto(file) {
  banner('idle', '解析中…', '');
  try {
    const det = await getDetector();
    const bmp = await createImageBitmap(file);
    // 大きい写真は縮小版 → 原寸の順に試す
    for (const max of [1600, 2400, Math.max(bmp.width, bmp.height)]) {
      const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
      cvs.width = Math.round(bmp.width * k); cvs.height = Math.round(bmp.height * k);
      ctx.drawImage(bmp, 0, 0, cvs.width, cvs.height);
      const res = await det.detect(cvs);
      if (res.length) { onScan(res[0].rawValue); return; }
      if (k === 1) break;
    }
    throw new Error('not found');
  } catch (e) {
    banner('warn', '読み取れません', 'バーコードを画面の中央に大きく、ピントを合わせて撮り直してください'); sound('warn');
  }
}

/* ======================= 音・振動 ======================= */
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, d, t0, type) {
  const a = ac(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.value = f; g.gain.value = 0.25;
  o.connect(g); g.connect(a.destination);
  const s = a.currentTime + (t0 || 0); o.start(s); o.stop(s + d);
}
function sound(k) {
  if (k === 'ok') tone(1200, .12);
  else if (k === 'done') { tone(1200, .1); tone(1700, .2, .13); }
  else if (k === 'ng') { tone(220, .35, 0, 'square'); tone(220, .35, .45, 'square'); }
  else tone(600, .25, 0, 'triangle');
  try { navigator.vibrate && navigator.vibrate(k === 'ng' ? [300, 120, 300] : k === 'warn' ? [150] : [60]); } catch (e) {}
}
document.addEventListener('pointerdown', () => ac(), { once: true });

const HMAP = {
  '納品日': '納品日', '納品曜日': '納品曜日', 'GAS仕分': 'GAS仕分', '便名': '便名', '午前午後': '午前午後', '順序': '順序',
  '口数': '口数', '出荷予定数計': '出荷予定数計', '緩衝材': '緩衝材', '得意先CD': '得意先CD', '得意先コード': '得意先CD',
  '得意先名': '得意先名', '配送先郵便番号': '郵便番号', '郵便番号': '郵便番号', '配送先住所': '住所', '住所': '住所',
  'TEL': 'TEL', '電話番号': 'TEL',
};
const normH = h => String(h == null ? '' : h).normalize('NFKC').replace(/\s/g, '').toUpperCase();
let parsed = [];
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('ライブラリを読み込めません')); document.head.appendChild(s); });
}
async function ensureXLSX() {
  if (window.XLSX) return;
  try { await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); }
  catch (e) { await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'); }
}
function normDate(s) {
  s = String(s || '').normalize('NFKC').trim();
  if (/^\d{8}$/.test(s)) return s;
  let m = s.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if (m) return m[1] + m[2].padStart(2, '0') + m[3].padStart(2, '0');
  if (/^\d{5}(\.\d+)?$/.test(s)) { const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(+s) * 86400000); return d.toISOString().slice(0, 10).replace(/-/g, ''); }
  return s.replace(/\D/g, '');
}
async function parseFile(file) {
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', codepage: 932 });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
  const hi = aoa.findIndex(r => r.some(c => normH(c) === '便名') && r.some(c => HMAP[normH(c)] === '得意先CD'));
  if (hi < 0) throw new Error(file.name + '：見出し行（便名・得意先ＣＤ）が見つかりません');
  const map = aoa[hi].map(h => HMAP[normH(h)] || HMAP[String(h).normalize('NFKC').replace(/\s/g, '')] || null);
  const rows = [];
  for (let i = hi + 1; i < aoa.length; i++) {
    const o = {}; let any = false;
    map.forEach((k, j) => { if (k) { o[k] = String(aoa[i][j] == null ? '' : aoa[i][j]).trim(); if (o[k]) any = true; } });
    if (!any || !o['便名'] || !o['得意先CD']) continue;
    o['納品日'] = normDate(o['納品日']);
    rows.push(o);
  }
  return rows;
}
$('#i-file').onchange = async e => {
  parsed = []; $('#i-result').innerHTML = ''; $('#i-run').disabled = true;
  const files = Array.from(e.target.files || []); if (!files.length) { $('#i-preview').innerHTML = ''; return; }
  $('#i-preview').innerHTML = '<span class="muted">読み込み中…</span>';
  try { await ensureXLSX(); } catch (err) { $('#i-preview').innerHTML = `<div class="err">${esc(errMsg(err))}</div>`; return; }
  const html = [];
  for (const f of files) {
    try {
      const rows = await parseFile(f);
      const dates = [...new Set(rows.map(r => r['納品日']))].sort();
      const bins = new Set(rows.map(r => r['便名']));
      const pk = rows.reduce((a, r) => a + (parseInt(r['口数'], 10) > 0 ? parseInt(r['口数'], 10) : 1), 0);
      parsed.push({ name: f.name, rows });
      html.push(`<div>📄 <b>${esc(f.name)}</b><br><span class="muted">納品日 ${dates.map(fmtDate).join(', ')}／${rows.length} 店舗・${bins.size} コース・${pk} 口</span></div>`);
    } catch (err) { html.push(`<div class="err">${esc(errMsg(err))}</div>`); }
  }
  $('#i-preview').innerHTML = html.join('<hr style="border:0;border-top:1px solid var(--line)">');
  $('#i-run').disabled = !parsed.length;
};
$('#i-run').onclick = async () => {
  $('#i-run').disabled = true; const out = [];
  for (const p of parsed) {
    $('#i-result').innerHTML = `<span class="muted">${esc(p.name)} を取込中…</span>`;
    try {
      const r = await api('importData', S.token, p.name, p.rows);
      r.results.forEach(x => out.push(`✅ ${fmtDate(x.date)}：${x.count} 件（追加 ${x.add}／更新 ${x.upd}／削除 ${x.del}${x.kept ? '／読取済のため残した ' + x.kept : ''}）`));
      if (r.skipped) out.push(`⚠ ${esc(p.name)}：納品日・便名・得意先CD が無い ${r.skipped} 行をスキップ`);
      S.dates = r.dates;
    } catch (e) { out.push(`<span class="err">❌ ${esc(p.name)}：${esc(errMsg(e))}</span>`); }
  }
  $('#i-result').innerHTML = out.join('<br>');
  parsed = []; $('#i-file').value = '';
  const t = new Date();
  if (!S.date || !S.dates.includes(S.date)) pickDate(`${t.getFullYear()}${String(t.getMonth() + 1).padStart(2, '0')}${String(t.getDate()).padStart(2, '0')}`);
  renderDates(); S.rows = []; loadDay();
  $('#p-date').innerHTML = S.dates.slice().reverse().map(d => `<option value="${d}">${fmtDate(d)}</option>`).join('');
  $('#p-date').value = S.date;
};

/* ---- 進捗 ---- */
let progRows = [];
async function loadProg() {
  const d = $('#p-date').value; if (!d) { $('#p-sum').innerHTML = '<tr><td class="muted">データがありません</td></tr>'; return; }
  $('#p-sum').innerHTML = '<tr><td class="muted">読み込み中…</td></tr>'; $('#p-detail-box').classList.add('hidden');
  try { progRows = (await api('getDay', S.token, d)).rows; } catch (e) { $('#p-sum').innerHTML = `<tr><td class="err">${esc(errMsg(e))}</td></tr>`; return; }
  const bins = []; progRows.forEach(r => { if (!bins.includes(r.bin)) bins.push(r.bin); });
  $('#p-sum').innerHTML = '<tr><th>コース</th><th class="num">店舗</th><th class="num">荷物</th><th class="num">進捗</th></tr>' + bins.map(b => {
    const rs = progRows.filter(r => r.bin === b), sd = rs.filter(r => r.state === '完了').length;
    const pk = rs.reduce((a, r) => a + r.need, 0), pd = rs.reduce((a, r) => a + Math.min(r.done, r.need), 0);
    return `<tr><td><button class="link" data-b="${esc(b)}">${esc(b)}</button></td><td class="num">${sd}/${rs.length}</td><td class="num">${pd}/${pk}</td><td class="num">${Math.round(pk ? pd / pk * 100 : 0)}%</td></tr>`;
  }).join('');
  $$('#p-sum .link').forEach(x => x.onclick = () => progDetail(x.dataset.b));
}
$('#p-load').onclick = loadProg;
$('#p-date').onchange = loadProg;
function progDetail(b) {
  $('#p-detail-box').classList.remove('hidden'); $('#p-detail-title').textContent = b;
  $('#p-detail').innerHTML = '<tr><th>店舗</th><th class="num">口数</th><th>状態</th><th></th></tr>' + progRows.filter(r => r.bin === b).map(r => `
    <tr><td>${esc(r.name)}<div class="muted">${esc(r.cd)}　${esc(r.staff)}　${esc(r.comp || r.first)}</div></td>
    <td class="num">${r.done}/${r.need}</td><td>${esc(r.state)}</td>
    <td>${r.done > 0 ? `<button class="link" data-cd="${esc(r.cd)}">リセット</button>` : ''}</td></tr>`).join('');
  $$('#p-detail .link').forEach(x => x.onclick = async () => {
    const r = progRows.find(y => y.bin === b && y.cd === x.dataset.cd);
    if (!confirm(`「${r.name}」の読取数を 0 に戻しますか？`)) return;
    try {
      const res = await api('resetRow', S.token, $('#p-date').value, b, r.cd);
      Object.assign(r, res.row); progDetail(b);
      if ($('#p-date').value === S.date) applyServerRow(res.row);
    } catch (e) { toast(errMsg(e), 4000); }
  });
  $('#p-detail-box').scrollIntoView({ behavior: 'smooth' });
}

/* ---- 社員 ---- */
let emps = [], editing = null;
async function loadEmps() {
  $('#e-list').innerHTML = '<tr><td class="muted">読み込み中…</td></tr>';
  try { emps = await api('listEmployees', S.token); renderEmps(); } catch (e) { $('#e-list').innerHTML = `<tr><td class="err">${esc(errMsg(e))}</td></tr>`; }
}
function renderEmps() {
  $('#e-companies').innerHTML = [...new Set(emps.map(e => e.company))].map(c => `<option value="${esc(c)}">`).join('');
  $('#e-list').innerHTML = '<tr><th>会社名</th><th>社員ID</th><th>名前</th><th>権限</th><th></th></tr>' + emps.map((e, i) => `
    <tr style="${e.active ? '' : 'opacity:.45'}"><td>${esc(e.company)}</td><td>${esc(e.id)}</td><td>${esc(e.name)}${e.active ? '' : '（無効）'}</td>
    <td>${e.admin ? '管理者' : ''}${e.pin ? ' 🔑' : ''}</td>
    <td style="white-space:nowrap"><button class="link" data-i="${i}" data-a="edit">編集</button>　<button class="link" data-i="${i}" data-a="rev">ログイン解除</button></td></tr>`).join('');
  $$('#e-list .link').forEach(x => x.onclick = () => {
    const e = emps[+x.dataset.i];
    if (x.dataset.a === 'edit') {
      editing = { id: e.id };
      $('#e-title').textContent = '社員の編集'; $('#e-company').value = e.company; $('#e-id').value = e.id; $('#e-name').value = e.name;
      $('#e-pin').value = e.pin; $('#e-admin').checked = e.admin; $('#e-active').checked = e.active;
      $('#e-cancel').textContent = '新規に戻す'; window.scrollTo(0, 0);
    } else revokeEmp(e);
  });
}
async function revokeEmp(e) {
  if (!confirm(`${e.name} さんの全端末のログインを解除しますか？（次回は再ログインが必要）`)) return;
  try { const n = await api('revokeEmployee', S.token, e.id); toast(`${n} 台の端末のログインを解除しました`); } catch (err) { toast(errMsg(err), 4000); }
}
function clearEmpForm() {
  editing = null; $('#e-title').textContent = '社員の追加'; $('#e-cancel').textContent = 'クリア';
  ['#e-id', '#e-name', '#e-pin'].forEach(s => $(s).value = ''); $('#e-admin').checked = false; $('#e-active').checked = true; $('#e-err').textContent = '';
}
$('#e-cancel').onclick = clearEmpForm;
$('#e-save').onclick = async () => {
  const emp = { company: $('#e-company').value.trim(), id: $('#e-id').value.trim(), name: $('#e-name').value.trim(), pin: $('#e-pin').value.trim(), admin: $('#e-admin').checked, active: $('#e-active').checked };
  $('#e-save').disabled = true; $('#e-err').textContent = '';
  try { emps = await api('saveEmployee', S.token, emp, editing); renderEmps(); clearEmpForm(); toast('保存しました'); }
  catch (e) { $('#e-err').textContent = errMsg(e); }
  finally { $('#e-save').disabled = false; }
};

/* ---- 設定 ---- */
async function loadSettings() {
  try { const s = await api('getSettingsAdmin', S.token); $('#c-prefix').value = s.prefix; $('#c-gap').value = s.gap; $('#c-ret').value = s.retention; } catch (e) { toast(errMsg(e)); }
}
$('#c-save').onclick = async () => {
  try {
    const s = await api('saveSettings', S.token, { prefix: $('#c-prefix').value, gap: $('#c-gap').value, retention: $('#c-ret').value });
    S.settings.prefix = s.prefix; S.settings.gap = s.gap; toast('保存しました（ドライバー端末は次回起動時に反映）', 4000);
  } catch (e) { toast(errMsg(e), 4000); }
};
$('#c-test-go').onclick = () => {
  const v = $('#c-test').value.trim(); if (!v) return;
  const save = S.settings.prefix; S.settings.prefix = $('#c-prefix').value.replace(/\D/g, '');
  const c = cands(v); S.settings.prefix = save;
  const hits = S.rows.filter(r => c.includes(r.cd));
  $('#c-test-out').innerHTML = `<div class="muted">店舗コード候補: ${c.map(esc).join(', ') || 'なし'}</div>` +
    (hits.length ? hits.map(r => `<div>✅ ${esc(r.cd)} ${esc(r.name)}（${esc(r.bin)}）</div>`).join('') : '<div class="err">表示中の納品日に該当店舗がありません</div>');
};

boot();
</script>
</body>
