<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="配送検品">
<meta name="theme-color" content="#1f5fbf">
<title>ルート配送 検品</title>
</head>
<body style="margin:0;font-family:sans-serif;color:#6b7385;text-align:center;padding-top:40vh;background:#f3f5f8">
<div id="msg">読み込み中…</div>
<script>
/*
 * 入口ページ（このファイルは今後更新不要）
 * 画面本体は GAS の app.html から毎回取得する。電波が無いときは前回の画面で起動する。
 */
(function () {
  var API_URL = 'https://script.google.com/macros/s/AKfycbySm69h-x-a0MzUqs79vxoNnKtGerC_8BY4qMKzatcevbP65dI-058Ioe-aQK06jQYABA/exec';
  var KEY = 'app_html';

  function show(html) { document.open(); document.write(html); document.close(); }
  function cached() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }

  var timer = new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, 8000); });
  var load = fetch(API_URL + '?page=app&t=' + Date.now(), { redirect: 'follow', cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (t) { if (!/<html/i.test(t)) throw new Error('bad'); return t; });

  Promise.race([load, timer]).then(function (html) {
    try { localStorage.setItem(KEY, html); } catch (e) {}
    show(html);
  }).catch(function () {
    var c = cached();
    if (c) show(c);
    else document.getElementById('msg').textContent = '読み込めませんでした。電波を確認して、再読み込みしてください。';
  });
})();
</script>
</body>
</html>
